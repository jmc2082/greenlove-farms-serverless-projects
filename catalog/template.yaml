AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: GreenLove Farms — Catalog Stack (products, variants, fulfillment profiles)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  MongoDbName:
    Type: String
    Default: greenlove_dev
  SharedLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /greenlove/dev/shared-layer-arn
  ApiDomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /greenlove/dev/api-domain-name
  UserPoolId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /greenlove/dev/cognito/user-pool-id
  UserPoolClientId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /greenlove/dev/cognito/client-id
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 15
    Architectures:
      - arm64
    Layers:
      - !Ref SharedLayerArn
    Environment:
      Variables:
        MONGODB_URI_PARAM: !Sub "/greenlove/${Environment}/mongodb-uri"
        MONGODB_DB_NAME: !Ref MongoDbName
        ENVIRONMENT: !Ref Environment
        SERVICE_VERSION: "0.1.0"

Resources:

  # ── HTTP API ──────────────────────────────────────────────────────────────────
  CatalogApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: GreenLove Catalog API
      Auth:
        DefaultAuthorizer: CognitoJWT
        Authorizers:
          CognitoJWT:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
              audience:
                - !Ref UserPoolClientId
            IdentitySource: "$request.header.Authorization"
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        AllowHeaders: ["Content-Type", "Authorization"]
        AllowOrigins: !Ref AllowedOrigins
        MaxAge: 600

  # Served at https://<ApiDomainName>/catalog/...
  CatalogApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: !Ref ApiDomainName
      ApiId: !Ref CatalogApi
      Stage: !Ref CatalogApi.Stage
      ApiMappingKey: catalog

  # ── Health ────────────────────────────────────────────────────────────────────
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-health"
      CodeUri: src/
      Handler: handlers/health/index.handler
      Description: Catalog service health check
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/health/index.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  # ── Products (public) ─────────────────────────────────────────────────────────
  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-list-products"
      CodeUri: src/
      Handler: handlers/products/list.handler
      Description: List active products (paginated, filter by category / fulfillment class)
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /products
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/products/list.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-product"
      CodeUri: src/
      Handler: handlers/products/get.handler
      Description: Get a single active product by slug
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /products/{slug}
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/products/get.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  # ── Categories (public) ───────────────────────────────────────────────────────
  ListCategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-list-categories"
      CodeUri: src/
      Handler: handlers/categories/list.handler
      Description: List visible categories with their active product counts
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /categories
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/categories/list.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  # ── Admin (Staff / Admins) ────────────────────────────────────────────────────
  AdminListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-list-products"
      CodeUri: src/
      Handler: handlers/admin/products/list.handler
      Description: List all products incl. drafts/archived (search, filter)
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/products
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/products/list.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminGetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-get-product"
      CodeUri: src/
      Handler: handlers/admin/products/get.handler
      Description: Get any product by id (full admin view)
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/products/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/products/get.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminCreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-create-product"
      CodeUri: src/
      Handler: handlers/admin/products/create.handler
      Description: Create a product
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/products
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/products/create.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminUpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-update-product"
      CodeUri: src/
      Handler: handlers/admin/products/update.handler
      Description: Partially update a product (requires current version)
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/products/{id}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/products/update.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminAdjustInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-adjust-inventory"
      CodeUri: src/
      Handler: handlers/admin/products/adjust-inventory.handler
      Description: Adjust a STOCKED variant's on-hand count (logged)
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/products/{id}/inventory
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/products/adjust-inventory.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminSignImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-sign-image-upload"
      CodeUri: src/
      Handler: handlers/admin/images/sign.handler
      Description: Sign a direct-to-Cloudinary product image upload
      Environment:
        Variables:
          CLOUDINARY_URL_PARAM: !Sub "/greenlove/${Environment}/cloudinary-url"
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/cloudinary-url"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/images/sign
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/images/sign.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminListCategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-list-categories"
      CodeUri: src/
      Handler: handlers/admin/categories/list.handler
      Description: List all categories incl. hidden
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/categories
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/categories/list.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

  AdminPutCategoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin-put-category"
      CodeUri: src/
      Handler: handlers/admin/categories/put.handler
      Description: Create or replace a category by slug
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "greenlove/${Environment}/mongodb-uri"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref CatalogApi
            Path: /admin/categories/{slug}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints: [handlers/admin/categories/put.ts]
        External: ["@greenlove/shared", mongodb, "@aws-sdk/*"]

Outputs:
  CatalogApiUrl:
    Description: Execute-api URL (direct)
    Value: !Sub "https://${CatalogApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  CatalogDomainUrl:
    Description: Custom-domain URL
    Value: !Sub "https://${ApiDomainName}/catalog"
