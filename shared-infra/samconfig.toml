version = 0.1

[default.global.parameters]
stack_name = "greenlove-shared-infra"
region     = "us-east-2"
profile    = "jm_ubuntu_thinkpad_user"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"

[default.build.parameters]
cached   = true
parallel = true

[default.deploy.parameters]
resolve_s3 = true
parameter_overrides = "Environment=\"dev\""
s3_prefix = "greenlove-shared-infra"
image_repositories = []

